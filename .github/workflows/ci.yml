name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and integration tests
        run: python -W error -m unittest discover -s tests -t . -v

  reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify data digests
        working-directory: data
        run: sha256sum -c SHA256SUMS
      - name: Data integrity, report regeneration and figure rendering
        env:
          RUN_SLOW: "1"
        run: python -W error -m unittest tests.test_data_integrity tests.test_reproducibility -v
