[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwell-inversion"
version = "1.0.0"
description = "Experiments on tool-using LLM auditor agents: virtual black-box barriers and the computational inverse Blackwell effect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.10"]

[project.scripts]
blackwell-inversion = "blackwell_inversion.cli:main"

[tool.setuptools.packages.find]
include = ["blackwell_inversion*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",    # long prompt literals and table rows are kept on one line
    "UP006",   # typing.Dict/List annotations are kept as written
    "UP035",
    "UP045",
    "B905",    # zip() without strict= is intentional in the numerical code
]
